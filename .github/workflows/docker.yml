# publish multi-arch images to docker.yuri.capital (kolektiv/kalendee).
#
# Secrets: shared YURI_CAPITAL_REPO_USERNAME / YURI_CAPITAL_REPO_PASSWORD,
# falling back to docker-specific YURI_CAPITAL_DOCKER_USERNAME /
# YURI_CAPITAL_DOCKER_PASSWORD when the shared secrets are absent.
name: Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.yuri.capital
  IMAGE_NAME: kolektiv/kalendee

jobs:
  pack-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pack/pnpm-lock.yaml

      - name: Install pack dependencies
        run: pnpm --dir server/pack install --frozen-lockfile

      - name: Check page context bindings
        run: node scripts/check-page-context.mjs

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check flake
        run: scripts/check-flake.sh

  smoke-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: kalendee-smoke:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: IMAGE_TAG=kalendee-smoke:ci scripts/smoke-image.sh --no-build

  docker:
    if: github.event_name != 'pull_request'
    needs: [pack-check, flake-check, smoke-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to docker.yuri.capital
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.YURI_CAPITAL_REPO_USERNAME || secrets.YURI_CAPITAL_DOCKER_USERNAME }}
          password: ${{ secrets.YURI_CAPITAL_REPO_PASSWORD || secrets.YURI_CAPITAL_DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
