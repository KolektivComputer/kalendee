name: Feature request
description: A new capability
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Check [GOALS.md](../../GOALS.md) first — requests that fit the goals are much more likely to land.
  - type: textarea
    id: problem
    attributes:
      label: What problem this solves
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Optional
    validations:
      required: false
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: false
