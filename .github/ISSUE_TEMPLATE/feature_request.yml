name: Feature request
description: Suggest an idea or improvement for Kalendee.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Kalendee! Please check [GOALS.md](../../GOALS.md) first — it explains the
        direction of the project. Feature requests that fit the goals are much more likely to land.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or workflow you are trying to improve. "I'm always frustrated when..." is fine.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Sketches, mockups, and API/UI ideas are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have tried or thought about.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server (API / CalDAV)
        - Web UI (Keel pack)
        - Desktop app
        - Android app
        - iOS app
        - Shared code (:core)
        - Infrastructure (Docker / Nix / CI)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps make the case (links, related issues, screenshots).
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
        - label: I am willing to submit a pull request for this.
          required: false
