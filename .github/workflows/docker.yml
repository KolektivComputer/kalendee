# publish multi-arch images to docker.yuri.capital (kolektiv/kalendee).
#
# Secrets: shared YURI_CAPITAL_REPO_USERNAME / YURI_CAPITAL_REPO_PASSWORD,
# falling back to docker-specific YURI_CAPITAL_DOCKER_USERNAME /
# YURI_CAPITAL_DOCKER_PASSWORD when the shared secrets are absent.
name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.yuri.capital
  IMAGE_NAME: kolektiv/kalendee

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to docker.yuri.capital
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.YURI_CAPITAL_REPO_USERNAME || secrets.YURI_CAPITAL_DOCKER_USERNAME }}
          password: ${{ secrets.YURI_CAPITAL_REPO_PASSWORD || secrets.YURI_CAPITAL_DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
