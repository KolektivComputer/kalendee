# Project coordinates. Release CI overrides version with -Pversion=<tag>.
group=computer.kolektiv.kalendee
version=0.1.0

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Publishing metadata
kalendee.displayName=Kalendee
kalendee.description=Self-hosted CalDAV server with multiplatform clients.
kalendee.url=https://github.com/KolektivComputer/kalendee
kalendee.scm=scm:git:https://github.com/KolektivComputer/kalendee.git
kalendee.licenseName=AGPL-3.0-only
kalendee.licenseUrl=https://www.gnu.org/licenses/agpl-3.0.txt
# Optional Nexus credentials. env in CI: YURI_CAPITAL_REPO_USERNAME / YURI_CAPITAL_REPO_PASSWORD.
# Local Maven: these two properties in ~/.gradle/gradle.properties.
# kalendee.publishing.yuriCapitalRepoUsername=
# kalendee.publishing.yuriCapitalRepoPassword=