name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/pack/package.json
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: server/pack/pnpm-lock.yaml
      - name: Install pack deps
        working-directory: server/pack
        run: pnpm install --frozen-lockfile
      - name: Build pack
        working-directory: server/pack
        run: pnpm build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test core + server
        run: ./gradlew :core:build :server:build --stacktrace
