name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in as much detail as you can.
        For security vulnerabilities, do NOT open a public issue — contact the maintainers privately instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Kalendee?
      options:
        - Docker Compose (docker-compose.yml)
        - Docker (standalone image)
        - NixOS module (flake.nix)
        - From source (./gradlew :server:run)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag (e.g. v1.2.3), container image digest, or git commit SHA.
      placeholder: v0.0.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server (API / CalDAV)
        - Web UI (Keel pack)
        - Desktop app
        - Android app
        - iOS app
        - Shared code (:core)
        - Infrastructure (Docker / Nix / CI)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste server logs or attach screenshots. This field is automatically formatted as code, no backticks needed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest `main` (or the latest release).
          required: false
        - label: I am willing to submit a pull request for this.
          required: false
