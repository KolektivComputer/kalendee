name: Documentation
description: Missing, outdated, or confusing docs
type: Task
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: File path or URL (e.g. DEVELOPING.md).
      placeholder: DEVELOPING.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What’s wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional.
    validations:
      required: false
